name: Xray Node Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-nodes:
    name: Test Proxy Nodes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PROXY_URL: ${{ vars.PROXY_URL }}
      XRAY_BIN: ./xray

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Xray-core
        run: |
          XRAY_VERSION=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Xray version: $XRAY_VERSION"
          curl -L -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o xray.zip xray
          chmod +x xray
          ./xray version

      - name: Run connectivity test
        id: test
        run: |
          python xary/xarytesting.py
        continue-on-error: true

      - name: Upload last config.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-config
          path: config.json
          retention-days: 1

      - name: Evaluate result
        if: steps.test.outcome == 'failure'
        run: |
          echo "::warning::部分或全部节点测试失败，请查看上方日志"
          exit 1
